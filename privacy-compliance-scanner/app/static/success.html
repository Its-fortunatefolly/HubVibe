<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're set up — Privacy Compliance Scanner</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0f14; color: #e8edf4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card { max-width: 560px; padding: 32px; background: #121822; border: 1px solid #232c3a; border-radius: 12px; }
  h1 { font-size: 1.3rem; margin-top: 0; }
  code.key {
    display: block; background: #0e1420; border: 1px solid #232c3a; padding: 14px; border-radius: 8px;
    word-break: break-all; margin: 14px 0; font-size: 0.95rem;
  }
  pre { background: #0e1420; border: 1px solid #232c3a; padding: 14px; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; }
  button { background: #4f8cff; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
  .muted { color: #9fb0c3; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="status-heading">Finishing setup…</h1>
    <p class="muted" id="status-text">Waiting for confirmation from Stripe — this usually takes a few seconds.</p>
    <div id="key-block" style="display:none;">
      <code class="key" id="api-key"></code>
      <button id="copy-button">Copy key</button>
      <p class="muted">Save this now — it's shown only once.</p>
      <pre id="curl-example"></pre>
    </div>
  </div>

<script>
function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

async function poll() {
  const sessionId = getParam("session_id");
  const headingEl = document.getElementById("status-heading");
  const textEl = document.getElementById("status-text");

  if (!sessionId) {
    headingEl.textContent = "Missing session";
    textEl.textContent = "No checkout session found in the URL.";
    return;
  }

  for (let attempt = 0; attempt < 15; attempt++) {
    const res = await fetch(`/billing/api-key?session_id=${encodeURIComponent(sessionId)}`);
    if (res.status === 200) {
      const data = await res.json();
      headingEl.textContent = "You're all set";
      textEl.textContent = "Here's your API key:";
      document.getElementById("api-key").textContent = data.api_key;
      document.getElementById("curl-example").textContent =
`curl -X POST https://${window.location.host}/scan \\
  -H "X-API-Key: ${data.api_key}" \\
  -H "Content-Type: application/json" \\
  -d '{"url": "https://yoursite.com"}'`;
      document.getElementById("key-block").style.display = "block";
      document.getElementById("copy-button").addEventListener("click", () => {
        navigator.clipboard.writeText(data.api_key);
      });
      return;
    }
    await new Promise((r) => setTimeout(r, 2000));
  }
  headingEl.textContent = "Still processing";
  textEl.textContent = "Payment confirmed, but your key isn't ready yet. Refresh this page in a minute.";
}

poll();
</script>
</body>
</html>
