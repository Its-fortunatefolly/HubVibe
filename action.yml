name: "HubVibe Site Compliance Audit"
description: Automated WCAG, SEO, security, and performance compliance audits for CI/CD pipelines.
author: "HubVibe"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  url:
    description: "The live URL to audit."
    required: true
  api-key:
    description: "Your HubVibe API key (X-API-Key). Get one at https://hubvibe-831480473793.us-south1.run.app via /billing/checkout."
    required: true
  endpoint:
    description: "Which audit to run: wcag, seo, security, performance, or bundle (all four, billed once)."
    required: false
    default: "bundle"
  fail-on-violation:
    description: "If false, the action reports results but never fails the build even if the audit didn't pass."
    required: false
    default: "true"

outputs:
  passed:
    description: "true or false -- whether the audit's overall `pass` field was true."
    value: ${{ steps.audit.outputs.passed }}
  response:
    description: "The raw JSON response body from the audit call."
    value: ${{ steps.audit.outputs.response }}

runs:
  using: "composite"
  steps:
    - id: audit
      shell: bash
      env:
        HUBVIBE_API_KEY: ${{ inputs.api-key }}
        TARGET_URL: ${{ inputs.url }}
        AUDIT_ENDPOINT: ${{ inputs.endpoint }}
        FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
      run: |
        set -euo pipefail

        base="https://hubvibe-831480473793.us-south1.run.app"
        http_code=$(curl -s -o response.json -w "%{http_code}" -X POST "$base/audit/$AUDIT_ENDPOINT" \
          -H "X-API-Key: $HUBVIBE_API_KEY" \
          -H "Content-Type: application/json" \
          -d "{\"url\": \"$TARGET_URL\"}")

        echo "HTTP status: $http_code"
        python3 -m json.tool response.json || cat response.json

        response_body=$(cat response.json)
        # GITHUB_OUTPUT needs multi-line-safe delimiter handling for raw JSON.
        {
          echo "response<<HUBVIBE_EOF"
          echo "$response_body"
          echo "HUBVIBE_EOF"
        } >> "$GITHUB_OUTPUT"

        if [ "$http_code" != "200" ]; then
          echo "passed=false" >> "$GITHUB_OUTPUT"
          echo "::error::HubVibe audit request failed with HTTP $http_code (see response.json above)"
          if [ "$FAIL_ON_VIOLATION" = "true" ]; then
            exit 1
          fi
          exit 0
        fi

        passed=$(python3 -c "import json; print(json.load(open('response.json'))['pass'])")
        if [ "$passed" = "True" ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
          echo "HubVibe audit passed."
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
          echo "::error::HubVibe audit failed -- see findings above"
          if [ "$FAIL_ON_VIOLATION" = "true" ]; then
            exit 1
          fi
        fi
