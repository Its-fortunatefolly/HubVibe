name: n8n integration

on:
  pull_request:
    paths:
      - "integrations/n8n/**"
      - "tests/test_n8n_recurring_audit.py"
      - ".github/workflows/n8n-integration.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "integrations/n8n/**"
      - "tests/test_n8n_recurring_audit.py"
      - ".github/workflows/n8n-integration.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  test:
    name: Validate importable workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Parse workflow JSON
        run: python -m json.tool integrations/n8n/hubvibe-recurring-audit.json >/dev/null
      - name: Test workflow contract and credential hygiene
        run: python -m pytest tests/test_n8n_recurring_audit.py -q
