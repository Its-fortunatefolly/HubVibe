name: Buyer router

on:
  pull_request:
    paths:
      - "integrations/hubvibe_router.py"
      - "tests/test_hubvibe_router.py"
      - "docs/buyer-router.md"
      - ".github/workflows/buyer-router.yml"
  push:
    branches: [main]
    paths:
      - "integrations/hubvibe_router.py"
      - "tests/test_hubvibe_router.py"
      - "docs/buyer-router.md"
      - ".github/workflows/buyer-router.yml"

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check httpx pytest
      - name: Compile the public client
        run: python -m py_compile integrations/hubvibe_router.py
      - name: Run walletless purchasing-safety tests
        run: python -m pytest tests/test_hubvibe_router.py -q
