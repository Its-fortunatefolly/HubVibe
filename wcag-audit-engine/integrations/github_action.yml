# Drop-in CI gate. Copy this file to .github/workflows/hubvibe-audit.yml in
# the repo you want audited, point AUDIT_URL at your deployed preview or
# staging URL, and set the HUBVIBE_API_KEY secret. That is the whole setup.
#
# This calls the published composite action rather than curl-ing the API by
# hand, on purpose: the action already retries transient failures with
# backoff, refuses to retry a 4xx (so a metered endpoint is never paid
# twice for the same answer), JSON-encodes the target URL instead of
# interpolating it into a string, and renders findings into the job summary
# where a reviewer will actually see them. A hand-rolled curl step gets none
# of that and has to be maintained against the API by whoever copied it.
#
# Cost: $0.10 per bundle run, $0.03 for a single dimension. A repo merging
# 100 pull requests a month running the full bundle on each spends $10/mo.
#
# Without HUBVIBE_API_KEY the run stops on the service's HTTP 402 and prints
# the payment challenge, which lists every rail this deployment can settle.
# It does not silently pass.

name: HubVibe Site Compliance Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      audit_url:
        description: "URL to audit (overrides AUDIT_URL below)"
        required: false
        type: string

env:
  # The one line to edit. Your deployed preview, staging, or production URL.
  AUDIT_URL: https://your-site.example.com

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - id: hubvibe
        uses: Its-fortunatefolly/hubvibe-audit-action@v1
        with:
          url: ${{ inputs.audit_url || env.AUDIT_URL }}
          api-key: ${{ secrets.HUBVIBE_API_KEY }}
          # wcag | seo | security | performance | bundle (all four, billed once)
          endpoint: bundle
          # Your regressions gate the build...
          fail-on-violation: true
          # ...but an outage in a third-party service does not block your
          # release. Flip to true once you are confident in the integration.
          fail-on-error: false

      # Everything the audit found is already in the job summary. This is
      # here for anything downstream that wants to branch on the verdict.
      - name: Report verdict
        if: always()
        run: echo "audit passed=${{ steps.hubvibe.outputs.passed }} http=${{ steps.hubvibe.outputs.http-status }}"
